<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ede8"/>
      <stop offset="100%" stop-color="#d4cfc8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="cameraBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9b9b9b"/>
      <stop offset="100%" stop-color="#6b6b6b"/>
    </linearGradient>
  </defs>
  <rect x="10" y="5" width="180" height="390" rx="20" fill="url(#body)"/>
  <rect x="18" y="50" width="164" height="290" rx="8" fill="url(#screen)"/>
  <!-- Camera visor bar -->
  <rect x="10" y="60" width="180" height="45" rx="0" fill="url(#cameraBar)"/>
  <circle cx="60" cy="82" r="16" fill="#4a4a4a"/>
  <circle cx="60" cy="82" r="11" fill="#1a1a1a"/>
  <circle cx="60" cy="82" r="5" fill="#2a2a2a"/>
  <circle cx="100" cy="82" r="14" fill="#4a4a4a"/>
  <circle cx="100" cy="82" r="9" fill="#1a1a1a"/>
  <!-- Punch hole -->
  <circle cx="100" cy="120" r="6" fill="#0a0a0a"/>
  <!-- Screen content -->
  <text x="100" y="210" text-anchor="middle" fill="white" font-size="13" font-family="Arial,sans-serif" font-weight="bold">Google</text>
  <text x="100" y="228" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="Arial,sans-serif">Pixel 7a</text>
  <!-- Home indicator -->
  <rect x="75" y="348" width="50" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
</svg>
