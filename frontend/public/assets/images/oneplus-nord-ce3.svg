<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>
  <rect x="10" y="5" width="180" height="390" rx="20" fill="url(#body)"/>
  <rect x="18" y="50" width="164" height="290" rx="8" fill="url(#screen)"/>
  <!-- Camera module -->
  <rect x="15" y="55" width="65" height="80" rx="14" fill="#2d3748"/>
  <circle cx="38" cy="82" r="16" fill="#1a2030"/>
  <circle cx="38" cy="82" r="11" fill="#080c10"/>
  <circle cx="38" cy="82" r="5" fill="#1a2030"/>
  <circle cx="65" cy="82" r="12" fill="#1a2030"/>
  <circle cx="65" cy="82" r="7" fill="#080c10"/>
  <circle cx="50" cy="110" r="8" fill="#1a2030"/>
  <!-- Punch-hole -->
  <circle cx="100" cy="65" r="6" fill="#080c10"/>
  <!-- Screen content -->
  <text x="110" y="195" text-anchor="middle" fill="white" font-size="11" font-family="Arial,sans-serif" font-weight="bold">OnePlus</text>
  <text x="110" y="212" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-family="Arial,sans-serif">Nord CE 3</text>
  <!-- Home indicator -->
  <rect x="75" y="350" width="50" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
</svg>
