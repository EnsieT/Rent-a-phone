<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#636366"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c2e"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
  </defs>
  <rect x="10" y="5" width="180" height="390" rx="24" fill="url(#body)"/>
  <rect x="18" y="55" width="164" height="285" rx="8" fill="url(#screen)"/>
  <!-- Dynamic Island -->
  <rect x="75" y="20" width="50" height="22" rx="11" fill="#1f1f1f"/>
  <!-- Camera bump -->
  <rect x="15" y="55" width="80" height="80" rx="12" fill="#6b6b70"/>
  <circle cx="40" cy="90" r="14" fill="#2c2c2e"/>
  <circle cx="40" cy="90" r="10" fill="#1c1c1e"/>
  <circle cx="40" cy="90" r="5" fill="#3a3a3c"/>
  <circle cx="70" cy="90" r="14" fill="#2c2c2e"/>
  <circle cx="70" cy="90" r="10" fill="#1c1c1e"/>
  <circle cx="70" cy="90" r="5" fill="#3a3a3c"/>
  <circle cx="55" cy="115" r="14" fill="#2c2c2e"/>
  <circle cx="55" cy="115" r="10" fill="#1c1c1e"/>
  <circle cx="55" cy="115" r="5" fill="#3a3a3c"/>
  <!-- Screen content -->
  <text x="120" y="160" text-anchor="middle" fill="white" font-size="14" font-family="Arial,sans-serif" font-weight="bold">Apple</text>
  <text x="120" y="180" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="Arial,sans-serif">iPhone 15 Pro</text>
  <!-- Home indicator -->
  <rect x="75" y="350" width="50" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>
</svg>
