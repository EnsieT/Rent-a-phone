<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
  </defs>
  <rect x="10" y="5" width="180" height="390" rx="24" fill="url(#body)"/>
  <rect x="18" y="55" width="164" height="285" rx="8" fill="url(#screen)"/>
  <!-- Notch -->
  <rect x="70" y="5" width="60" height="28" rx="0" fill="#1c1c1e"/>
  <rect x="70" y="18" width="60" height="15" rx="7" fill="#1f1f1f"/>
  <!-- Camera -->
  <rect x="15" y="55" width="75" height="75" rx="12" fill="#2c2c2e"/>
  <circle cx="37" cy="82" r="13" fill="#1c1c1e"/>
  <circle cx="37" cy="82" r="9" fill="#0a0a0f"/>
  <circle cx="37" cy="82" r="4" fill="#2c2c2e"/>
  <circle cx="63" cy="82" r="13" fill="#1c1c1e"/>
  <circle cx="63" cy="82" r="9" fill="#0a0a0f"/>
  <circle cx="63" cy="82" r="4" fill="#2c2c2e"/>
  <!-- Screen content -->
  <text x="118" y="170" text-anchor="middle" fill="white" font-size="14" font-family="Arial,sans-serif" font-weight="bold">Apple</text>
  <text x="118" y="190" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="Arial,sans-serif">iPhone 14</text>
  <!-- Home indicator -->
  <rect x="75" y="350" width="50" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>
</svg>
